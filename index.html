<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traffic-Game</title>
  <link rel="stylesheet" href="./src/css/style.css">
</head>
<body>
  <div id="gameArea">
    <div id="hudLeft">
        <div id="fuelContainer">
          <div id="fuelBar"></div>
          <span>⛽</span>
        </div>
    </div>
    <div id="road">
      <div id="pause" class="hidden"> PAUSADO [P]<br> "P" Retomar</div>
    </div>
    <div id="hudRight">
      <div id="speedometer">
        <div id="speedNeedle"></div>
          <div class="speedLabel">60 KM/H</div>
        </div>
      <div id="scoreboard">
        <div id="coinsDisplay">💰 0</div>
        <div id="pointsDisplay">🏆 0</div>
      </div>
    </div>
  </div>
  <div id="menu" class="flex">
    <div><h1>🚗 Endeless Traffic Game 🚦</h1></div>
    <div id="perfil">
      <div id="imageIcon"></div>
      <div id="divRanking" class="hidden">
          <div id="divInternaRanking">
            <div id="lbRanking"> <h3>Ranking</h3></div>
            <div id="ranking">
              <ol id="rankingList"></ol>
            </div>
          </div>
          <div id="Moedas"><h3>🪙 Moedas: </h3></div>
      </div>
      <div id="shop" class="hidden">
          <div id="lbShop"><h3>Garagem</h3></div>
          <div id="carList"></div>
          <div id="MoedaShop"><h3>🪙 Moedas: </h3></div>
      </div>
      <div id="config" class="hidden">
          <div id="lbVolMotor">Configurações de som do carro</div>
          <div>
            <button id="btnSom">On/Off</button>
          </div>
          <div id="volMotor">
              <label id="lbVolMotor">Volume Motor: <input id="motorVol" type="range" min="0" max="1" step="0.1" value="0.3"></label><br>
          </div>
      </div>
      
    </div>
    <div id="btns">
      <div id="btnPlay">Jogar</div>
      <div id="gameMode" class="hidden">
        <div id="btnNormal">Normal</div>
        <div id="btnHard">Túnel</div>
      </div>
      <div id="btnShop">Garagem</div>
      <div id="btnRanking">Ranking</div>
      <div id="btnConfig">Configurações</div>
    </div>
    </div>
  </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="src/js/pista.js"></script>
    <script src="src/js/road.js"></script>
    <script src="src/js/coins.js"></script>
    <script src="src/js/gas.js"></script>
    <script src="src/js/itens.js"></script>
    <script src="src/js/traffic.js"></script>
    <script src="src/js/nitro.js"></script>
    <script src="src/js/score.js"></script>
    <script src="src/js/shop.js"></script>
    <script src="src/js/player.js"></script>
    <script src="src/js/collision.js"></script>
    <script src="src/js/main.js"></script>
    <script src="src/js/menu.js"></script>
</body>
</html>
