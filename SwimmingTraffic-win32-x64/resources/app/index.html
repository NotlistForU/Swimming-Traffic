<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traffic-Game</title>
  <link rel="stylesheet" href="./src/css/style.css">
</head>
  <body>   
      <!-- HUD (fica escondido até começar o jogo) -->
        <div id="hud" class="hidden">
          <!-- Combustível -->
          <div id="fuelContainer">
            <div id="fuelBar"></div>
            <span>⛽</span>
          </div>

          <!-- Velocímetro / Score -->
          <div id="hudRight">
            <div id="speedometer">
              <div id="speedNeedle"></div>
              <div class="speedLabel">60 KM/H</div>
            </div>
            <div id="scoreboard">
              <div id="coinsDisplay">💰 0</div>
              <div id="pointsDisplay">🏆 0</div>
            </div>
          </div>
        </div>
      <div id="menu">
        <h1>🚗 Endeless Traffic Game 🚦</h1>
        <div id="perfil">
          <div id="imageIcon"></div>
          <div id="ranking">
            <h3>Ranking</h3>
            <ol id="rankingList"></ol>
            <div id="moedasDisplay"> <h3> Moedas: </h3></div>
          </div> 
        </div>
        <div id="divBtn">
          <button id="btnPlay">Jogar</button>
        </div>
        <div id="divBtnConfig">
          <button id="btnConfig">Configurações</button>
        </div>
        <div id="config" class="hidden">
          <div id="volMotor">
            <label id="lbVolMotor">Volume Motor: <input id="motorVol" type="range" min="0" max="1" step="0.1" value="0.3"></label><br>
          </div>
          <div id="volAcel">
            <label>Volume Aceleração: <input id="aceleroVol" type="range" min="0" max="1" step="0.1" value="0.3"></label>
          </div>
        </div>
        <div id="divBtnVoltar">
          <button id="btnVoltar">Voltar</button>
        </div>
      </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="src/js/pista.js"></script>
    <script src="src/js/road.js"></script>
    <script src="src/js/coins.js"></script>
    <script src="src/js/gas.js"></script>
    <script src="src/js/itens.js"></script>
    <script src="src/js/traffic.js"></script>
    <script src="src/js/nitro.js"></script>
    <script src="src/js/score.js"></script>
    <script src="src/js/player.js"></script>
    <script src="src/js/collision.js"></script>
    <script src="src/js/main.js"></script>
    <script src="src/js/menu.js"></script>
    
  </body>
</html>
